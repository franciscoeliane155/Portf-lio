<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfólio</title>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="css/projects/projects.css">
        <script src="https://unpkg.com/lucide@latest"></script> 
    </head>

    <body data-page="projects">
        <script type="module" src="js/core/app.js"></script>

        <main>
            <header class="topbar">
                <div class="topbar-container">
                    <nav class="navbar">
                        <a href="index.html" >Home</a>
                        <a href="projects.html" class="active">Projetos</a>
                        <a href="aboutMe.html">Sobre Mim</a>
                        <a href="certificates.html">Certificados</a>
                        <a href="contacts.html">Contactos</a>
                    </nav>
                </div>
            </header>
            <section id="Projects" class="projects-page">
                <div class="container">
                    <header class="projects-header">
                        <h2>Projetos</h2>
                        <p>
                            Cada projeto representa uma oportunidade de aprendizagem,
                            um desafio superado e um passo na minha evolução como programadora.
                        </p>
                    </header>
                    <div class="projects-search">
                        <i data-lucide="search"></i>
                        <input
                            type="text"
                            id="searchProjects"
                            placeholder="Pesquisar projetos..."
                        >

                    </div>
                    <div id="projectsFilters" class="projects-filters"></div>
                    <div id="projectsGrid" class="projects-grid"></div>
                    <div id="projectModal" class="modal">
                    <div class="modal-overlay"></div>
                    <div class="modal-content">
                        <button class="close-modal">
                            <i data-lucide="x"></i>
                        </button>
                        <div id="modalBody"></div>
                    </div>
                </div>
                <div class="projects-more">
                    <button id="toggleProjects">
                        Ver mais projetos
                    </button>
                </div>
            </section>  
            
            <footer class="portfolio-footer">
                <div class="portfolio-footer-divider"></div>
                <p class="portfolio-footer-author">
                    Feito por <strong>Eliane Francisco</strong>
                </p>
                <div class="portfolio-footer-links">
                    <a href="https://github.com/teu-github" target="_blank">
                        GitHub
                    </a>
                    <span>·</span>
                    <a href="https://linkedin.com/in/teu-linkedin" target="_blank">
                        LinkedIn
                    </a>
                    <span>·</span>
                    <a href="mailto:franciscoeliane155@email.com">
                        Email
                    </a>
                </div>
                <p class="portfolio-footer-copy">
                    © 2026
                </p>
            </footer> 
        </main>
    </body>
</html>
